<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>在线播放</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{
  background:#0f172a;color:#f1f5f9;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;
  touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
h1{font-size:1.1em;margin-bottom:16px;text-align:center;word-break:break-all;max-width:100%}
.media-wrap{width:100%;max-width:640px}
video,audio{width:100%;max-width:100%;border-radius:12px;background:#000}
audio{background:#1e293b;padding:10px}
.dl{
  margin-top:18px;padding:10px 24px;border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  text-decoration:none;font-weight:700;display:inline-block;
}
.dl:active{transform:scale(.97)}
.tip{margin-top:14px;color:#94a3b8;font-size:.8em;text-align:center}
.err{
  color:#fca5a5;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);
  padding:14px;border-radius:10px;max-width:640px;width:100%;text-align:center;
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  // 防止 iOS 双指缩放与双击放大
  document.addEventListener('gesturestart',function(e){e.preventDefault()});
  document.addEventListener('gesturechange',function(e){e.preventDefault()});
  var lastTouchEnd=0;
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(now-lastTouchEnd<=300){e.preventDefault()}
    lastTouchEnd=now;
  },{passive:false});

  var params=new URLSearchParams(location.search);
  var v=params.get('v');
  var t=params.get('t')||'在线播放';
  var type=params.get('type')||'video';
  var isVideo=type!=='audio';
  var app=document.getElementById('app');

  if(!v){
    app.innerHTML='<div class="err">未指定媒体地址</div><div class="tip">链接无效或已失效</div>';
    return;
  }

  var safeTitle=t.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var mediaTag=isVideo
    ? '<video src="'+v+'" controls playsinline webkit-playsinline preload="metadata"></video>'
    : '<audio src="'+v+'" controls preload="metadata"></audio>';

  app.innerHTML=
    '<h1>'+(isVideo?'🎬':'🎵')+' '+safeTitle+'</h1>'+
    '<div class="media-wrap">'+mediaTag+'</div>'+
    '<a class="dl" href="'+v+'" download="'+safeTitle+'">⬇ 下载原文件</a>'+
    '<div class="tip">在线播放 · 永久有效</div>';
})();
</script>
</body>
</html>
